name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src + vite.config.ts)
        run: npm run typecheck

      - name: Unit + DOM smoke tests
        run: npm test

      - name: Production build
        run: npm run build

      # The app is deliberately dependency-free; keep the bundle honest.
      - name: Bundle size budget (260 kB JS / 60 kB CSS, gzipped)
        run: |
          set -euo pipefail
          js=$(find dist/assets -name '*.js' -print0 | xargs -0 cat | gzip -9 | wc -c)
          css=$(find dist/assets -name '*.css' -print0 | xargs -0 cat | gzip -9 | wc -c)
          echo "gzipped js=${js}B css=${css}B"
          test "$js" -lt 266240 || { echo "::error::JS bundle exceeded 260 kB gzipped"; exit 1; }
          test "$css" -lt 61440 || { echo "::error::CSS bundle exceeded 60 kB gzipped"; exit 1; }

      - name: Upload build artefact
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
